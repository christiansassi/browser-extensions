<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 310px;
      padding: 16px;
      background: #fff;
      color: #17233c;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 11px;
      padding-bottom: 14px;
      border-bottom: 1px solid #e6e9ee;
    }
    #popup-icon {
      width: 40px;
      height: 40px;
      border-radius: 9px;
      flex: 0 0 auto;
    }
    .title {
      min-width: 0;
      font-size: 15px;
      line-height: 1.2;
      font-weight: 700;
      white-space: nowrap;
    }
    .control {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 0 8px;
    }
    .control + .control {
      padding-top: 11px;
    }
    .control-copy { flex: 1; min-width: 0; }
    .control-title {
      font-size: 14px;
      font-weight: 650;
      margin-bottom: 5px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #5f6b7a;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #a8afb8;
      flex: 0 0 auto;
    }
    body.active .dot { background: #16a34a; }
    .switch {
      position: relative;
      width: 44px;
      height: 24px;
      flex: 0 0 auto;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      border-radius: 999px;
      background: #c7cbd1;
      transition: background .15s ease, box-shadow .15s ease;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      left: 2px;
      top: 2px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.25);
      transition: transform .15s ease, background .15s ease;
    }
    input:checked + .slider {
      background: #fff;
      box-shadow: inset 0 0 0 1px #aeb4bd;
    }
    input:checked + .slider::before {
      transform: translateX(20px);
      background: #111;
    }
    .theme-picker {
      display: flex;
      width: 116px;
      height: 30px;
      padding: 2px;
      gap: 2px;
      border-radius: 8px;
      background: #eceff2;
      border: 1px solid #d9dde2;
      flex: 0 0 auto;
    }
    .theme-option {
      appearance: none;
      border: 0;
      margin: 0;
      flex: 1;
      min-width: 0;
      border-radius: 6px;
      background: transparent;
      color: #657080;
      font: inherit;
      font-size: 11px;
      font-weight: 650;
      cursor: pointer;
      transition: background .15s ease, color .15s ease, box-shadow .15s ease;
    }
    .theme-option[data-theme="light"].selected {
      background: #fff;
      color: #111;
      box-shadow: 0 1px 2px rgba(0,0,0,.12);
    }
    .theme-option[data-theme="dark"].selected {
      background: #1f2328;
      color: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,.18);
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 12px;
      padding-top: 11px;
      font-size: 11px;
      color: #8a93a0;
    }
    body.off-site .control-title,
    body.off-site .status { opacity: .62; }
    body.off-site .switch,
    body.off-site .theme-picker { opacity: .45; }
    body.off-site .slider,
    body.off-site .theme-option { cursor: default; }
    @media (prefers-color-scheme: dark) {
      body { background: #1b1f23; color: #f3f5f7; }
      .header { border-color: #343a40; }
      .status { color: #aab2bd; }
      .footer { color: #929aa5; }
      .theme-picker { background: #282d32; border-color: #3a4047; }
      .theme-option { color: #aab2bd; }
      .theme-option[data-theme="light"].selected { background: #fff; color: #111; }
      .theme-option[data-theme="dark"].selected { background: #0f1113; color: #fff; }
      input:checked + .slider { box-shadow: inset 0 0 0 1px #c5cad0; }
    }
  </style>
</head>
<body>
  <div class="header">
    <img id="popup-icon" src="icons/icon48-bw.png" alt="">
    <div class="title">Notion Theme</div>
  </div>

  <div class="control">
    <div class="control-copy">
      <div class="control-title">Enable theme override</div>
      <div class="status"><span class="dot"></span><span id="status-text">Checking site...</span></div>
    </div>
    <label class="switch" aria-label="Enable Notion theme override">
      <input id="toggle" type="checkbox" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="control">
    <div class="control-copy">
      <div class="control-title">Theme</div>
    </div>
    <div class="theme-picker" role="group" aria-label="Theme">
      <button class="theme-option" data-theme="light" type="button">Light</button>
      <button class="theme-option" data-theme="dark" type="button">Dark</button>
    </div>
  </div>

  <div class="footer"><span>v1.0.1</span></div>

  <script src="popup.js"></script>
</body>
</html>
